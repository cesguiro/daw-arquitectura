# Punto de entrada único: los estáticos en / y la API en /api/ viaja a Tomcat
server {
    listen 80;
    server_name _;

    # API → Tomcat embebido (Spring Boot) por la red interna de Compose.
    # Al no poner URI en proxy_pass, la ruta llega a la api con su prefijo /api/.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend estático (HTML, CSS, JS) montado desde ./frontend
    location / {
        root    /usr/share/nginx/html;
        index   index.html;
        try_files $uri $uri/ /index.html;
    }
}
