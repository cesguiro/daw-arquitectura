# daw-arquitectura: nginx (estáticos + proxy) → Spring Boot (Tomcat embebido) → MariaDB + MinIO
# Solo nginx publica puerto al exterior; el resto vive en la red interna de Compose.
services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"                      # punto de entrada único (cámbialo a "80:80" si lo tienes libre)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - app

  app:
    build: ./app                       # API REST con Tomcat embebido escuchando en :8080 interno
    environment:
      DB_URL: jdbc:mariadb://db:3306/miapp    # nombres de servicio, no localhost: DNS interno de Compose
      DB_USERNAME: app
      DB_PASSWORD: app123
      S3_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy     # no arranques la app hasta que MariaDB acepte conexiones
      minio:
        condition: service_started

  db:
    image: mariadb:12.3
    environment:
      MARIADB_ROOT_PASSWORD: secreto
      MARIADB_DATABASE: miapp
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # esquema + datos la primera vez
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: elestio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: secreto123
    volumes:
      - minio-data:/data

volumes:
  db-data:
  minio-data:
