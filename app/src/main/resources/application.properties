# Tomcat embebido escucha en :8080 dentro del contenedor; nginx hace proxy a ese puerto
server.port=8080

# En Compose llegan como variables de entorno (ver compose.yaml); si no existen,
# valen los valores por defecto para ejecutar fuera de Docker
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/miapp}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app123}
